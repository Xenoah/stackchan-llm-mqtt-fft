; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:m5stack-cores3]
platform = espressif32@6.12.0
board = m5stack-cores3
framework = arduino
; Reject invalid servo feedback in pinned BSP 1.1.0, including after reinstall.
extra_scripts = post:tools/patch_stackchan_bsp.py
monitor_speed = 115200
; アプリ 5.75MB（読み辞書を含む）+ 内蔵ボイスパック用 LittleFS 10.1MiB（partitions.csv）
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
; 内蔵ボイスの読み辞書（tools/make_dict.py が作る）をファームウェアに埋め込む
board_build.embed_files =
  dict/ja.dic
  dict/en.dic
build_unflags = -std=gnu++11 -DARDUINO_USB_MODE=1
build_flags =
  -std=gnu++17
  -DUART_SCLK_DEFAULT=UART_SCLK_APB
  -DARDUINO_USB_MODE=0
  '-DUSB_PRODUCT="StackChan USB Spectrum"'
  -include include/UsbBoardConfig.h
  -Wl,--wrap=tud_descriptor_configuration_cb
lib_deps =
  m5stack/M5Unified@0.2.17
  https://github.com/stack-chan/m5stack-avatar.git#v0.10.0
  https://github.com/m5stack/StackChan-BSP.git#1.1.0
  https://github.com/m5stack/M5CoreS3.git#1.0.1
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7.4.2
